name: WCAG PR Build Agent

on:
  pull_request:
    branches: ["main"]

jobs:
  accessibility-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Run Jest
      - name: Run Jest Accessibility Test
        id: jest
        run: |
          npm run test:a11y || echo "jest_failed=true" >> $GITHUB_ENV

      - name: Annotate Jest Violations
        if: env.jest_failed == 'true'
        run: |
          jq -r '
          (.violations // [])[] |
          "::error title=Jest Axe - \(.id)::Impact: \(.impact // "unknown"), Help: \(.help // "N/A") | Element: \(.nodes[0].html // "N/A")"
          ' jest-a11y-report.json || echo "No Jest violations found"

      # Run Playwright
      - name: Run Playwright Accessibility Test
        id: playwright
        run: |
          npm i -g wait-on
          npm run dev & wait-on http://localhost:5173
          npm run test:e2e || echo "playwright_failed=true" >> $GITHUB_ENV

      - name: Annotate Playwright Violations
        if: env.playwright_failed == 'true'
        run: |
          jq -r '
          (.violations // [])[] |
          "::error title=Playwright Axe - \(.id)::Impact: \(.impact // "unknown"), Help: \(.help // "N/A") | Element: \(.nodes[0].html // "N/A")"
          ' playwright-accessibility-report.json || echo "No PW violations"

      # Upload artifacts
      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: wcag-accessibility-reports
          path: |
            jest-a11y-report.json
            playwright-accessibility-report.json
            reports/*.html

      # Fail if violations exist
      - name: Fail if Violations Found
        if: env.jest_failed == 'true' || env.playwright_failed == 'true'
        run: exit 1
