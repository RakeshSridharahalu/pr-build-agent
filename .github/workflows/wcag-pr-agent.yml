name: WCAG PR Build Agent

on:
  pull_request:

jobs:
  accessibility-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      ########################################
      # Run Jest Axe and Save Results
      ########################################
      - name: Run Jest Accessibility Test
        id: jest
        run: |
          npm run test:a11y || echo "jest_failed=true" >> $GITHUB_ENV

      - name: Normalize Jest JSON Structure
        if: env.jest_failed == 'true'
        run: |
          echo "📌 Normalizing Jest JSON..."
          jq '{
            violationCount: (.violations | length),
            violations: [.violations[] | {
              id, impact, help, html: (.nodes[0].html // "N/A")
            }]
          }' jest-a11y-report.json > reports-jest.json

      ########################################
      # Run Playwright Axe and Format Output
      ########################################
      - name: Install wait-on
        run: npm install -g wait-on

      - name: Run Playwright Accessibility Test
        id: playwright
        run: |
          npm run dev & wait-on http://localhost:5173

          # Force playwright reporter output
          npx playwright test --reporter=json | tee raw-playwright.json

          mv raw-playwright.json playwright-accessibility-report.json || true

          # Mark failure condition
          if [ $? -ne 0 ]; then
            echo "playwright_failed=true" >> $GITHUB_ENV
          fi


      - name: Normalize Playwright JSON Structure
        if: env.playwright_failed == 'true'
        run: |
          echo "📌 Normalizing Playwright JSON..."
          jq '
            if .violations then
              {
                violationCount: (.violations | length),
                violations: [.violations[] | {
                  id, impact, help, html: (.nodes[0].html // "N/A")
                }]
              }
            else empty end
          ' playwright-accessibility-report.json > reports-playwright.json

      ########################################
      # Upload Final Clean Reports
      ########################################
      - name: Upload Accessibility Reports
        uses: actions/upload-artifact@v4
        with:
          name: wcag-accessibility-reports
          path: |
            reports-jest.json
            reports-playwright.json

      ########################################
      # Block PR if violations exist
      ########################################
      - name: Fail if any violations exist
        if: env.jest_failed == 'true' || env.playwright_failed == 'true'
        run: |
          echo "❌ Accessibility violations found — blocking PR."
          exit 1
