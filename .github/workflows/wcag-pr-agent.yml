name: ♿ WCAG Accessibility Report

on:
  pull_request:

jobs:
  accessibility-tests:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write   # required for commenting
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Run Jest Accessibility test, capture exit but continue
      - name: Run Jest Accessibility Test
        id: jest
        run: |
          npm run test:a11y || echo "jest_failed=1" >> $GITHUB_ENV

      # Run Playwright Accessibility test, capture exit but continue
      - name: Run Playwright Accessibility Test
        id: playwright
        run: |
          npm run test:e2e || echo "playwright_failed=1" >> $GITHUB_ENV

      # Generate HTML reports
      - name: Generate HTML Reports
        run: |
          mkdir -p reports
          node << 'EOF'
          const fs = require('fs');

          if (fs.existsSync('jest-a11y-report.json')) {
            const data = JSON.parse(fs.readFileSync('jest-a11y-report.json', 'utf8'));
            const violations = data.violations || [];
            fs.writeFileSync('reports/jest-summary.json', JSON.stringify(violations, null, 2));
            console.log(`📁 Jest Summary Created (${violations.length} issues)`);
          } else {
            console.log("⚠ Jest report not found — skipping summary generation.");
          }

          if (fs.existsSync('playwright-accessibility-report.json')) {
            const pData = JSON.parse(fs.readFileSync('playwright-accessibility-report.json', 'utf8'));
            fs.writeFileSync('reports/playwright-summary.json', JSON.stringify(pData, null, 2));
            console.log("📁 Playwright Summary Created");
          } else {
            console.log("⚠ Playwright report not found — skipping summary generation.");
          }
          EOF


      # Upload artifacts
      - name: Upload Accessibility Reports
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-reports
          path: |
            jest-a11y-report.json
            playwright-accessibility-report.json
            reports/

      # Annotate violations inside Checks Tab
      - name: Publish Jest Violations to Checks
        if: env.jest_failed == '1'
        run: |
          jq -r '.violations[] | "::error title=\(.id)::Impact: \(.impact) — \(.help) | \(.nodes[0].html)"' jest-a11y-report.json

      # Create or update PR comment
      - name: Post PR Violation Summary
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          header: "♿ WCAG Accessibility Scan Results"
          message: |
            ### 🔍 Accessibility Violations Detected
            
            **Jest Violations:** ${{ env.jest_failed == '1' && '❌ Found issues' || '✅ Passed' }}  
            **Playwright Violations:** ${{ env.playwright_failed == '1' && '❌ Found issues' || '✅ Passed' }}

            📎 Reports available under **Artifacts → accessibility-reports**

            _(Merging is allowed, but fixing accessibility issues is recommended.)_

      # This prevents blocking merge but marks workflow as warning
      - name: Soft Fail on Violations
        if: env.jest_failed == '1' || env.playwright_failed == '1'
        run: echo "⚠ Accessibility violations detected — marking workflow as warning."
        continue-on-error: true
