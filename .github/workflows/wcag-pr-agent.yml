name: WCAG PR Build Agent

on:
  pull_request:
    branches: ["main"]

jobs:
  accessibility-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # -------------------------------
      # Run Jest Accessibility Tests
      # -------------------------------
      - name: Run Jest Accessibility Test
        id: jest
        run: |
          npm run test:a11y || echo "jest_failed=true" >> $GITHUB_ENV

      - name: Annotate Jest Violations
        if: env.jest_failed == 'true'
        run: |
          echo "🔍 Annotating Jest accessibility violations..."
          if [ -f jest-a11y-report.json ]; then
            jq -r '
              (.violations // [])[] |
              "::error title=Jest Axe - \(.id)::Impact: \(.impact // "N/A"), Help: \(.help // "N/A") | Element: \(.nodes[0].html // "N/A")"
            ' jest-a11y-report.json
          fi

      # -------------------------------
      # Run Playwright Accessibility Tests
      # -------------------------------
      - name: Install wait-on utility
        run: npm install -g wait-on

      - name: Run Playwright Accessibility Test
        id: playwright
        run: |
          npm run dev & wait-on http://localhost:5173
          npm run test:e2e || echo "playwright_failed=true" >> $GITHUB_ENV

      - name: Annotate Playwright Violations
        if: env.playwright_failed == 'true'
        run: |
          echo "🔍 Annotating Playwright accessibility violations..."
          if [ -f playwright-accessibility-report.json ]; then
            jq -r '
              (.violations // [])[] |
              "::error title=Playwright Axe - \(.id)::Impact: \(.impact // "N/A"), Help: \(.help // "N/A") | Element: \(.nodes[0].html // "N/A")"
            ' playwright-accessibility-report.json
          fi

      # -------------------------------
      # Format Reports into Clean JSON
      # -------------------------------
      - name: Format JSON Reports for Readability
        run: |
          mkdir -p reports/clean

          if [ -f jest-a11y-report.json ]; then
            jq '{
              violationCount: (.violations | length),
              violations: (.violations[] | {
                id,
                impact,
                help,
                html: .nodes[0].html
              }) | [.]
            }' jest-a11y-report.json > reports/clean/jest-accessibility-clean.json
          fi

          if [ -f playwright-accessibility-report.json ]; then
            jq '{
              violationCount: (.violations | length),
              violations: (.violations[] | {
                id,
                impact,
                help,
                html: .nodes[0].html
              }) | [.]
            }' playwright-accessibility-report.json > reports/clean/playwright-accessibility-clean.json
          fi

      # -------------------------------
      # Upload Clean JSON Reports
      # -------------------------------
      - name: Upload Accessibility Reports
        uses: actions/upload-artifact@v4
        with:
          name: wcag-accessibility-reports
          path: reports/clean/

      # -------------------------------
      # BLOCK PR if violations exist
      # -------------------------------
      - name: Fail if any violations exist
        if: env.jest_failed == 'true' || env.playwright_failed == 'true'
        run: |
          echo "❌ Accessibility violations found — blocking PR."
          exit 1
