name: WCAG PR Build Agent

on:
  pull_request:

jobs:
  accessibility-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # -------------------------------
      # Run Jest Accessibility Tests
      # -------------------------------
      - name: Run Jest Accessibility Test
        id: jest
        run: |
          npm run test:a11y || echo "jest_failed=true" >> $GITHUB_ENV

      - name: Annotate Jest Violations (Readable Format)
        if: env.jest_failed == 'true'
        run: |
          if [ -f jest-a11y-report.json ]; then
            echo "📌 Formatting Jest Accessibility Violations..."
            jq -r '
              (.violations // [])[] |
              "::error file=jest-a11y-report.json,title=🔴 JEST ACCESSIBILITY VIOLATION: \(.id|ascii_downcase) ::
              Rule: \(.id)
              Impact: \(.impact)
              Help: \(.help)
              Affected Node: \(.nodes[0].html)
              Docs: \(.helpUrl)
              "
            ' jest-a11y-report.json
          fi


      # -------------------------------
      # Run Playwright Accessibility Tests
      # -------------------------------
      - name: Run Playwright Accessibility Test
        id: playwright
        run: |
          npx wait-on http://localhost:5173 & npm run dev &
          sleep 5
          npm run test:e2e || echo "playwright_failed=true" >> $GITHUB_ENV

      - name: Annotate Playwright Violations (Readable Format)
        if: env.playwright_failed == 'true'
        run: |
          if [ -f playwright-accessibility-report.json ]; then
            echo "📌 Formatting Playwright Accessibility Violations..."
            jq -r '
              .suites[].specs[].tests[].results[]? |
              select(.error != null) |
              "::error file=playwright-accessibility-report.json,title=🔴 PLAYWRIGHT ACCESSIBILITY VIOLATION::
              Rule: \(.error.message|split("\n")[0])
              Severity: high
              Details: See report for more context
              "
            ' playwright-accessibility-report.json
          fi

      # -------------------------------
      # Generate HTML Reports (Fix you needed)
      # -------------------------------
      - name: Generate HTML Reports
        run: npm run generate:report

      # -------------------------------
      # Upload JSON + HTML artifacts
      # -------------------------------
      - name: Upload Accessibility Reports
        uses: actions/upload-artifact@v4
        with:
          name: wcag-accessibility-reports
          path: |
            jest-a11y-report.json
            playwright-accessibility-report.json
            reports/*.html

      # -------------------------------
      # BLOCK PR if any violations exist
      # -------------------------------
      - name: Fail if any violations exist
        if: env.jest_failed == 'true' || env.playwright_failed == 'true'
        run: |
          echo "❌ Accessibility violations found — blocking PR."
          exit 1
